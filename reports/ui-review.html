<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI review</title></head><body><div id="app"></div><script type="module">
import '/src/styles/main.css';import '/src/styles/menu.css';import '/src/styles/gameplay-polish.css';import '/src/styles/world-map.css';import '/src/styles/mobile-ui.css';
import {HUD} from '/src/ui/HUD.ts';import {UIManager} from '/src/ui/UIManager.ts';import {GameState} from '/src/game/GameState.ts';import {ProgressionManager} from '/src/progression/ProgressionManager.ts';
const root=document.querySelector('#app'),screen=new URLSearchParams(location.search).get('screen')||'hud';
const errors=[];window.addEventListener('error',event=>errors.push(event.message));
if(screen==='hud'){const hud=new HUD(root,{onPause(){}});hud.setBombLimit(90);hud.setStageInfo(5,1,10,100,'El Cachopo Monumental');hud.update(5,72,24.12,100);}
else {const state=new GameState(),progression=new ProgressionManager();state.levelRunTime=57.62;state.levelRunCollectibles=85;state.lives=8;if(screen==='map-detail'){progression.isAllUnlocked=()=>true;progression.isWorldUnlocked=()=>true;progression.isLevelUnlocked=()=>true;progression.isLevelCompleted=()=>true;progression.getLevelRecord=()=>({bestTime:57,totalCollectibles:100,completedCharacters:['rony','adri','misi','pao'],clearCount:3});}if(screen==='level-clear-skin'){progression.getUnannouncedSkinRewards=()=>[{characterId:'rony',skinId:'blue'}];progression.markSkinRewardsAnnounced=()=>{};}const ui=new UIManager(root,state,progression,{onStartStage(){},onSelectCharacter(){},onOpenEditor(){},onResume(){},onRestartStage(){},onNextStage(){},onReturnToMenu(){}});ui.titleEntered=!['intro','title-transition'].includes(screen);if(screen==='loading'){ui.showLevelLoading(4,3,1);}else{ui.renderScreen(screen==='intro'||screen==='title-transition'?'title':screen==='level-clear-skin'?'level-clear':screen==='map-detail'?'world-select':screen);}if(screen==='title-transition'){const entry=document.querySelector('#btn-enter-menu');entry.focus();entry.click();if(document.activeElement===entry)errors.push('Hidden Play retained focus');}if(screen==='map-detail'){const map=ui.overworldMap;map.expandWorld(4,false,true);const node=map.getLevelNodesForWorld((await import('/src/levels/WorldDefinitions.ts')).getWorldById(4))[2];map.selectLevelNode(node,false,true);}document.querySelectorAll('.cloud-transition').forEach(element=>element.remove());}
setTimeout(()=>{
 const outside=[...document.querySelectorAll('button,input,select,.hud-badge,.char-selection-pane,.char-preview-pane')].filter(element=>{const r=element.getBoundingClientRect(),style=getComputedStyle(element);return style.visibility!=='hidden'&&style.display!=='none'&&!element.closest('[inert]')&&r.width>0&&r.height>0&&(r.left<-.5||r.right>innerWidth+.5);}).map(e=>e.id||e.className);
 const badges=[...document.querySelectorAll('.hud-top-bar>*')];
 for(let i=0;i<badges.length;i++)for(let j=i+1;j<badges.length;j++){const a=badges[i].getBoundingClientRect(),b=badges[j].getBoundingClientRect();if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>1&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>1)errors.push('HUD overlap: '+badges[i].className+' / '+badges[j].className);}
 const preview=document.querySelector('.char-preview-pane');if(preview&&innerWidth>innerHeight&&preview.getBoundingClientRect().bottom>innerHeight+.5)errors.push('Character preview exceeds screen height');
 if(screen==='pause'){document.querySelector('[data-pause-camera="2"]').click();if(document.querySelector('[data-pause-camera="2"]').getAttribute('aria-pressed')!=='true')errors.push('Camera button did not activate');document.querySelector('[data-pause-camera="1"]').click();}
 const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&!e.closest('[inert]');};
 if(!['options','hud','map-detail'].includes(screen)){
  const screenEl=document.querySelector('.screen');if(screenEl&&screenEl.scrollHeight>screenEl.clientHeight+2)errors.push('Screen needs vertical scrolling');
  for(const e of document.querySelectorAll('button'))if(visible(e)){const r=e.getBoundingClientRect();if(r.top<-.5||r.bottom>innerHeight+.5)errors.push('Offscreen button: '+(e.id||e.className));}
 }
 if(screen==='character-select'&&innerWidth>innerHeight){for(const e of document.querySelectorAll('.char-card')){const r=e.getBoundingClientRect();if(r.bottom>innerHeight||r.top<0)errors.push('All four characters must fit');}}
 if(screen==='loading'){const a=document.querySelector('.loading-content').getBoundingClientRect(),b=document.querySelector('.loading-bottom').getBoundingClientRect();if(a.bottom>b.top-2)errors.push('Loading text overlaps avatar');}
 if(screen==='map-detail'){const a=document.querySelector('.sidebar-content');if(a.scrollHeight>a.clientHeight+2)errors.push('Map details need scrolling');const b=document.querySelector('#btn-start-level');if(b&&b.getBoundingClientRect().bottom>innerHeight)errors.push('Play button outside map panel');}
 if(screen==='title-transition'&&document.activeElement?.id!=='btn-play-game')errors.push('Menu focus not restored');
 if(screen==='character-select'&&innerWidth<1000&&getComputedStyle(document.querySelector('.char-preview-guide')).display!=='none')errors.push('Mobile controls guide visible');
 const result={screen,width:innerWidth,height:innerHeight,horizontalOverflow:document.documentElement.scrollWidth>innerWidth,outside,errors};
 const output=document.createElement('pre');output.id='review-result';output.hidden=true;output.textContent=JSON.stringify(result);document.body.append(output);
},1800);
</script></body></html>
