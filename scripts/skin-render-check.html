<!doctype html><html lang="es"><meta charset="utf-8"><title>Comprobación de skins · Mega RAMP</title>
<style>body{margin:20px;background:#16202c;color:#fff;font:16px system-ui}canvas{max-width:100%;height:auto}output{display:block;margin:12px 0;padding:12px;background:#243b45}a{color:#9ef}</style>
<h1>Comprobación de las 72 poses</h1><p>Columnas: Normal, Move1, Move2, Scary1, Scary2, Happy. Filas: cada personaje y sus tres formas.</p>
<output id="result">Comprobando carga inicial y texturas…</output><a href="/">Volver al juego</a><div id="view"></div>
<script type="module">
import * as THREE from 'three';
import {SpriteTextures} from '/src/rendering/SpriteTextures.ts';
import {CHARACTERS} from '/src/player/Characters.ts';
import {getCharacterSkins,characterSpritePath} from '/src/player/CharacterSkins.ts';
const result=document.querySelector('#result');
try {
 const states=['normal','move1','move2','scary1','scary2','happy'],rows=CHARACTERS.flatMap(c=>getCharacterSkins(c.id).map(s=>({c,s}))),items=[];
 const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false});renderer.setSize(768,1536);renderer.setClearColor(0x213d49,1);document.querySelector('#view').append(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-3,3,6,-6,.1,20);camera.position.z=10;
 rows.forEach(({c,s},row)=>states.forEach((state,col)=>{
   const texture=SpriteTextures.getCharacterTexture(c.id,state,s.id),sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,alphaTest:.1}));
   sprite.position.set(col-2.5,5.5-row,0);sprite.scale.setScalar(.95);scene.add(sprite);items.push({c,s,state,texture});
 }));
 const target=new THREE.WebGLRenderTarget(48,48),probeScene=new THREE.Scene(),probeCamera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);probeCamera.position.z=5;
 const probe=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true}));probe.scale.setScalar(2);probeScene.add(probe);const pixels=new Uint8Array(48*48*4);let errors=0;
 function check(){let visible=0;renderer.setRenderTarget(target);renderer.setClearColor(0,0);
   for(const item of items){probe.material.map=item.texture;probe.material.needsUpdate=true;renderer.render(probeScene,probeCamera);renderer.readRenderTargetPixels(target,0,0,48,48,pixels);
     if(pixels.some((value,i)=>i%4===3&&value>24))visible++;if(renderer.getContext().getError()!==0)errors++;
   }
   renderer.setRenderTarget(null);renderer.setClearColor(0x213d49,1);renderer.render(scene,camera);return visible;
 }
 const initial=check();
 await Promise.all(items.map(item=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error(characterSpritePath(item.c.id,item.s.id,item.state)));img.src=characterSpritePath(item.c.id,item.s.id,item.state);}))); 
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const loaded=check(),dimensions=items.every(item=>item.texture.image.width===512&&item.texture.image.height===512);
 result.textContent=`Inicial: ${initial}/72 visibles · Cargadas: ${loaded}/72 visibles · Dimensiones estables: ${dimensions?'SÍ':'NO'} · Errores WebGL: ${errors}`;
 result.dataset.passed=String(initial===72&&loaded===72&&dimensions&&errors===0);
}catch(error){result.textContent='ERROR: '+error.message;result.dataset.passed='false';console.error(error);}
</script></html>
